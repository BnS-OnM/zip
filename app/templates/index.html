<!DOCTYPE html>
<html>
<head>
  <title>FACQ PDF Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="file"],
    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      margin-right: 10px;
      cursor: pointer;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .secondary {
      background-color: #28a745;
    }
    .secondary:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
<h2>FACQ PDF Upload</h2>

<h3>Download XLSX alleen</h3>
<form action="/upload-xlsx" method="post" enctype="multipart/form-data">
  <div class="form-group">
    <label for="file1">PDF Bestand:</label>
    <input type="file" id="file1" name="file" accept="application/pdf" required>
  </div>
  <button type="submit">Download XLSX</button>
</form>

<hr style="margin: 40px 0;">

<h3>Upload en importeer in Odoo</h3>
<form action="/upload-and-import" method="post" enctype="multipart/form-data">
  <div class="form-group">
    <label for="file2">PDF Bestand:</label>
    <input type="file" id="file2" name="file" accept="application/pdf" required>
  </div>
  <div class="form-group">
    <label for="customer_name">Klant Naam:</label>
    <input type="text" id="customer_name" name="customer_name" value="FACQ Customer" required>
  </div>
  <div class="form-group">
    <label for="customer_email">Klant Email (optioneel):</label>
    <input type="email" id="customer_email" name="customer_email" placeholder="klant@example.com">
  </div>
  <button type="submit" class="secondary">Download XLSX + Importeer in Odoo</button>
</form>
</body>
</html>
